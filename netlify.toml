[build]
  command = "cd frontend && npm install --legacy-peer-deps && npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "18"
  VITE_API_BASE_URL = "https://military-management-system-cq3z.onrender.com"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  framework = "#custom"
  command = "cd frontend && npm install --legacy-peer-deps && npm run dev"
  targetPort = 5173
  port = 8888
  publish = "frontend/dist"
  autoLaunch = true